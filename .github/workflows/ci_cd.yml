name: CI/CD Pipeline

on:
  push:
    branches: [ main ]


jobs:
  build:
    if: github.event_name== 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name:  Setup Java 21
      uses: actions/setup-java@v3
      with : 
        java-version: '21'
        distribution: 'temurin'

    - name: Build Jar with Gradle
      working-directory: ./backend
      run: |
        chmod +x gradlew
        ./gradlew clean bootJar

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and Push Backend Docker Images
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/librarycrud:latest

    - name: Build and Push Frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend 
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/librarycrud-frontend:latest

    - name: copy script and compose to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        source: "deploy.sh,docker-compose.yml"
        target: "/home/${{ secrets.EC2_USER }}/"

    - name: Trigger deployment script on EC2
      uses: appleboy/ssh-action@master
      env: 
        DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DB_USER: ${{ secrets.POSTGRES_USER }}
        DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        DB_NAME: ${{ secrets.POSTGRES_DB }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: DOCKER_USER
        port: 22
        script: |
          cd /home/${{ secrets.EC2_USER }}/app
          chmod +x deploy.sh

          export DOCKERHUB_USERNAME=$DOCKER_USER
          export POSTGRES_USER=$DB_USER
          export POSTGRES_PASSWORD=$DB_PASSWORD
          export POSTGRES_DB=$DB_NAME

          ./deploy.sh

    